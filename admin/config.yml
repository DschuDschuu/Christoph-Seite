# Editor-Einstellungen (Sveltia CMS). Christoph-Jakobus-Wagner/Christoph-Inhalte und https://example.org werden beim Bauen ersetzt.
backend:
  name: github
  repo: Christoph-Jakobus-Wagner/Christoph-Inhalte
  branch: main
  commit_messages:
    create: 'Neu: {{slug}}'
    update: 'Geändert: {{slug}}'
    delete: 'Gelöscht: {{slug}}'
    uploadMedia: 'Hochgeladen: {{path}}'
    deleteMedia: 'Medium gelöscht: {{path}}'

site_url: https://example.org
display_url: https://example.org
media_folder: media
public_folder: /media
slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: eintraege
    label: Einträge
    label_singular: Eintrag
    folder: eintraege
    create: true
    slug: '{{year}}-{{month}}-{{ort}}'
    summary: '{{titel}} · {{ort}}'
    sortable_fields: [datum, titel, ort]
    fields:
      # Reihenfolge: erst schreiben (Titel, Bausteine, Persönliches), dann die Angaben. Pflichtfelder unten sind
      # trotzdem sicher: Sveltia speichert nicht, solange eins fehlt, und springt hin. Paare stehen per editor.css nebeneinander.
      - { label: Titel, name: titel, widget: string }
      # Baukasten: der Text eines Eintrags als Folge von Bausteinen (Reihenfolge = Reihenfolge auf der Seite).
      # Gespeichert als Liste mit „type“; dargestellt über src/lib/bausteine.ts, im Editor über vorschau.js.
      - label: Inhalt
        name: inhalt
        label_singular: Baustein
        widget: list
        required: false
        hint: 'Mit „+ Baustein hinzufügen“ Text, Fotos, Notizzettel oder Lieder einfügen. Mit den Pfeilen oder am Griff verschieben.'
        # Neue Einträge starten mit einem leeren Text-Baustein (leere Bausteine erscheinen auf der Seite nicht)
        default: [{ type: text, text: '' }]
        types:
          - { label: Text, name: text, widget: object, summary: '{{fields.text}}', fields: [{ label: Text, name: text, widget: markdown, required: false, buttons: [bold, italic, link], editor_components: [], hint: 'Links öffnen sich auf der Seite im Bilderrahmen.' }, { label: Mit Initiale beginnen, name: initiale, widget: boolean, default: false, required: false, hint: 'Der erste Buchstabe wird groß und verziert, z. B. nach einer Zwischenüberschrift.' }] }
          - { label: Zwischenüberschrift, name: ueberschrift, widget: object, summary: '{{fields.text}}', fields: [{ label: Zwischenüberschrift, name: text, widget: string }] }
          - { label: Foto, name: foto, widget: object, summary: '{{fields.text}}', fields: [{ label: Foto, name: bild, widget: image }, { label: Bildunterschrift, name: text, widget: string, required: false }] }
          - { label: Fotostreifen, name: streifen, widget: object, summary: '{{fields.text}}', fields: [{ label: Fotos (2 oder 3), name: bilder, widget: list, min: 2, max: 3, field: { label: Foto, name: bild, widget: image } }, { label: Unterschrift, name: text, widget: string, required: false }] }
          - { label: Notizzettel, name: notiz, widget: object, summary: '{{fields.text}}', fields: [{ label: Notiz, name: text, widget: text, hint: 'Erscheint handgeschrieben auf einem gelben Zettel.' }] }
          - { label: Lied, name: lied, widget: object, summary: '{{fields.titel}}', fields: [{ label: YouTube-Link, name: link, widget: string, hint: 'Ab hier läuft beim Lesen dieses Lied. Davor erscheinen Fußspuren. Das erste Lied läuft ab Anfang.' }, { label: 'Interpret – Lied', name: titel, widget: string, required: false }] }
      - { label: 'Persönliches (lila Kasten am Ende, für alle sichtbar)', name: persoenliches, widget: text, required: false }
      - { label: 'Ganz persönlich 🔒 (wird nie veröffentlicht)', name: ganz_persoenlich, widget: text, required: false }
      - { label: Datum, name: datum, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD.MM.YYYY', time_format: false, default: '{{now}}', hint: 'Steht automatisch auf heute.' }
      # Einträge mit Reise sind Stationen dieser Reise (Reihenfolge nach Datum), ohne Reise einzelne Tagebuch-Einträge.
      - { label: Gehört zur Reise, name: reise, widget: relation, collection: reisen, value_field: '{{slug}}', search_fields: [titel], display_fields: ['{{titel}}'], required: false, hint: 'Leer = einzelner Tagebuch-Eintrag.' }
      - { label: Ort, name: ort, widget: string, hint: 'z. B. Lissabon' }
      - { label: Land, name: land, widget: string, hint: 'auf Deutsch, z. B. Portugal' }
      # Karte statt Zahlenfelder. decimals: 2 = ca. 1 km genau, damit z. B. die Unterkunft nicht erkennbar ist.
      - { label: Ort auf der Karte, name: karte, widget: map, decimals: 2, center: [10, 48], zoom: 4, hint: 'Suchen, auf die Karte tippen oder Standort nehmen (ca. 1 km genau).' }
      - { label: Ortszeit beim Schreiben, name: uhrzeit, widget: string, required: false, hint: 'z. B. 21:40' }
      - { label: Wetter, name: wetter, widget: string, required: false, hint: 'z. B. 19 °C, klarer Himmel' }
      - { label: Titelbild, name: titelbild, widget: image, required: false }
      - label: Galerie
        name: galerie
        widget: list
        required: false
        fields:
          - { label: Bild, name: bild, widget: image }
          - { label: Bildunterschrift, name: text, widget: string, required: false }
      - { label: 'Vorlese-Datei (MP3 mit deiner Stimme)', name: vorlesen, widget: file, required: false }
      - { label: 'Entwurf (noch nicht veröffentlichen)', name: entwurf, widget: boolean, default: false, required: false }

  - name: gedichte
    label: Gedichte
    label_singular: Gedicht
    folder: gedichte
    create: true
    identifier_field: titel
    slug: '{{slug}}'
    summary: '{{titel}}'
    fields:
      - { label: Titel, name: titel, widget: string }
      - { label: Datum, name: datum, widget: datetime, format: 'YYYY-MM-DD', date_format: 'DD.MM.YYYY', time_format: false }
      - { label: Gehört zum Eintrag, name: eintrag, widget: relation, collection: eintraege, value_field: '{{slug}}', search_fields: [titel, ort], display_fields: ['{{titel}} ({{ort}})'], required: false, hint: 'Der Ort wird dann vom Eintrag übernommen.' }
      - { label: 'Ort (nur falls ohne Eintrag)', name: ort, widget: string, required: false }
      - { label: 'Ort auf der Karte (nur falls ohne Eintrag)', name: karte, widget: map, decimals: 2, center: [10, 48], zoom: 4, required: false }
      - { label: Gedicht, name: body, widget: text, hint: 'Jede Zeile in eine eigene Zeile, Strophen durch eine Leerzeile trennen.' }
      - { label: 'Entwurf (noch nicht veröffentlichen)', name: entwurf, widget: boolean, default: false, required: false }

  # Reisen: fassen Einträge zu Stationen zusammen. Zeitraum und Strecke ergeben sich aus den Stationen.
  - name: reisen
    label: Reisen
    label_singular: Reise
    folder: reisen
    create: true
    identifier_field: titel
    slug: '{{slug}}'
    summary: '{{titel}}'
    fields:
      - { label: Titel, name: titel, widget: string, hint: 'z. B. Marokko & Iberien' }
      - { label: Kurzbeschreibung, name: beschreibung, widget: text, required: false }
      - { label: Titelbild, name: titelbild, widget: image, required: false }

  # Einstellungen: einzelne Dateien statt Listen. Impressum-Angaben werden derzeit nirgends angezeigt (Seite gilt als privat),
  # bleiben aber gepflegt, falls das Impressum wieder eingebaut wird (siehe src/lib/rechtliches.ts).
  - name: einstellungen
    label: Einstellungen
    files:
      - name: rechtliches
        label: Impressum & Kontakt (derzeit nicht auf der Seite)
        file: einstellungen/rechtliches.md
        fields:
          - { label: 'Vor- und Nachname', name: name, widget: string, required: false }
          - { label: 'Straße und Hausnummer', name: strasse, widget: string, required: false }
          - { label: 'PLZ und Ort', name: ort, widget: string, required: false }
          - { label: 'E-Mail', name: email, widget: string, required: false, hint: 'Wird derzeit nicht auf der Seite angezeigt.' }
          - { label: 'Telefon (freiwillig)', name: telefon, widget: string, required: false }
